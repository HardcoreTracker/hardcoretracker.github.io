name: Build server mod

on:
  push:
    branches: [main]
    paths:
      - "mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Pick the mod jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          cp "$JAR" build/hardcore-tracker.jar
          echo "path=mod/build/hardcore-tracker.jar" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hardcore-tracker
          path: ${{ steps.jar.outputs.path }}

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-latest
          name: Hardcore Tracker server mod (latest)
          make_latest: true
          body: |
            Server-side Fabric mod for Minecraft 26.3. Download **hardcore-tracker.jar** below and follow the install steps in mod/README.md.
            Built from commit ${{ github.sha }}.
          files: ${{ steps.jar.outputs.path }}
